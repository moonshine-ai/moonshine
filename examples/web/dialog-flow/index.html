<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Moonshine — Dialog Flow</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        max-width: 720px; margin: 3rem auto; padding: 0 1rem; line-height: 1.5;
      }
      h1 { font-size: 1.6rem; }
      button {
        font-size: 1rem; padding: 0.6rem 1.1rem; border-radius: 0.5rem;
        border: 1px solid currentColor; background: transparent; cursor: pointer;
      }
      button[disabled] { opacity: 0.5; cursor: default; }
      #status { margin: 1rem 0; opacity: 0.75; min-height: 1.4em; }
      #log {
        margin-top: 1.5rem; padding: 1rem; border-radius: 0.5rem;
        border: 1px solid rgba(128,128,128,0.4); min-height: 8rem;
      }
      .user { color: #2a7; }
      .assistant { color: #4af; }
      hr { border: none; border-top: 1px solid rgba(128,128,128,0.3); margin: 1.5rem 0; }
      .row { display: flex; gap: 0.6rem; align-items: center; flex-wrap: wrap; }
      #utterance { flex: 1; min-width: 12rem; font: inherit; padding: 0.5rem;
        border-radius: 0.5rem; border: 1px solid rgba(128,128,128,0.4); }
    </style>
  </head>
  <body>
    <h1>Moonshine — Dialog Flow</h1>
    <p>
      A voice-driven conversation running fully on-device. Say
      <strong>“set up wifi”</strong> to start the flow, or “cancel” / “start over”
      at any time.
    </p>
    <button id="toggle">Start</button>

    <hr />
    <p>Or type what you'd say (drives the same flow without a microphone):</p>
    <div class="row">
      <input id="utterance" type="text" placeholder="e.g. set up wifi" />
      <button id="send">Send</button>
    </div>

    <p id="status">Idle.</p>
    <div id="log" aria-live="polite"></div>

    <script type="module">
      // Load the locally-built binding when the page is opened with ?local=1
      // (e.g. via examples/web/serve.mjs); otherwise use the published copy
      // from the jsDelivr CDN.
      const params = new URLSearchParams(location.search);
      const useLocal = params.get('local') === '1';
      // With &assets=local, models are fetched from the repo (served by
      // serve.mjs) instead of the CDN, so the page runs fully offline. With
      // &nomic=1 we build the dialog runner but skip the microphone, so the
      // flow can be driven by the text box below. The browser integration test
      // uses both.
      const useLocalAssets = params.get('assets') === 'local';
      const noMic = params.get('nomic') === '1';
      const moduleUrl = useLocal
        ? '/wasm/dist/index.js'
        : 'https://cdn.jsdelivr.net/npm/@moonshine-ai/moonshine-wasm/dist/index.js';
      const { TextToSpeech, DialogFlow } = await import(moduleUrl);

      const toggle = document.getElementById('toggle');
      const statusEl = document.getElementById('status');
      const logEl = document.getElementById('log');
      const utteranceEl = document.getElementById('utterance');
      const sendBtn = document.getElementById('send');

      let dialog = null;
      let running = false;

      function log(role, text) {
        const div = document.createElement('div');
        div.className = role;
        div.textContent = `${role}: ${text}`;
        logEl.appendChild(div);
        logEl.scrollTop = logEl.scrollHeight;
      }

      /** The flow: an ordinary async function, read top to bottom. */
      async function wifiSetup(d) {
        const ssid = await d.ask("What's the name of your wifi network?");
        if (!(await d.confirm(`I heard ${ssid}. Is that right?`))) {
          await d.say("No problem, let's start over.");
          return;
        }
        if (await d.confirm('Apply these changes?')) {
          await d.say(`Done. Connecting to ${ssid}.`);
        } else {
          await d.say('Okay, nothing changed.');
        }
      }

      // Only needed for the offline integration test, where the voice assets
      // and the embedding model are served from different repo paths. The voice
      // comes in as a pre-built engine; modelsFrom points the embedding model at
      // its own base. Normally load() fetches all of this from the CDN itself.
      const LOCAL_EMBEDDING_BASE = '/test-assets/embeddinggemma-300m-ONNX';

      function loadLocalTts() {
        return new TextToSpeech().language('en_us').modelsFrom('/tts-data').load();
      }

      /** Builds the dialog runner (and, unless disabled, the microphone). */
      async function start({ useMic = true } = {}) {
        toggle.disabled = true;
        statusEl.textContent = 'Loading models (first run downloads them)…';
        try {
          dialog = new DialogFlow()
            .microphone(useMic)
            .onHeard((text) => log('user', text))
            .onSaid((text) => log('assistant', text))
            .onProgress((fraction, file) => {
              statusEl.textContent = `Downloading ${file} ${Math.round(100 * fraction)}%…`;
            });

          dialog.listenFor('set up wifi', wifiSetup);

          if (useLocalAssets) {
            dialog.useTextToSpeech(await loadLocalTts()).modelsFrom(LOCAL_EMBEDDING_BASE);
          }

          // One call downloads the speech-to-text, embedding and voice models,
          // wires them together, and attaches the microphone. "cancel" and
          // "start over" work without being registered.
          await dialog.load();

          if (useMic) {
            await dialog.startListening();
            statusEl.textContent = 'Listening… say “set up wifi”.';
            toggle.textContent = 'Stop';
          } else {
            statusEl.textContent = 'Ready — type “set up wifi” below.';
          }
          running = true;
          window.__dialogReady = true;
        } catch (err) {
          statusEl.textContent = 'Failed to start: ' + err.message;
        } finally {
          toggle.disabled = false;
        }
      }

      async function stop() {
        toggle.disabled = true;
        await dialog?.stopListening();
        dialog?.close();
        dialog = null;
        running = false;
        window.__dialogReady = false;
        statusEl.textContent = 'Stopped.';
        toggle.textContent = 'Start';
        toggle.disabled = false;
      }

      // Feed a typed utterance in exactly as if it had been heard.
      function sendUtterance() {
        const text = utteranceEl.value.trim();
        if (!text || !dialog) return;
        utteranceEl.value = '';
        dialog.handleUtterance(text);
      }

      toggle.addEventListener('click', () => (running ? stop() : start()));
      sendBtn.addEventListener('click', sendUtterance);
      utteranceEl.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') sendUtterance();
      });

      // In no-mic mode, build the runner immediately so the text box works
      // without a user gesture (used by the browser integration test).
      if (noMic) start({ useMic: false });
    </script>
  </body>
</html>
